<!--
  Este componente se adapta solo con CSS:
  • En móvil (< md): se muestra como bottom nav horizontal
  • En desktop (md+): se muestra como sidebar vertical
  El truco está en que el <host> cambia de flex-direction según el breakpoint.
-->

<!-- ── Iconos de navegación ───────────────────────────────────────────── -->

<!-- Chat -->
<button
  class="menu-btn"
  (click)="onChatsClick.emit()"
  aria-label="Chats">
  <img src="icons/chats.png" class="menu-icon" alt="Chats">
  <span class="menu-label">Chats</span>
</button>

<!-- Solicitudes -->
<button
  class="menu-btn"
  (click)="onRequestsClick.emit()"
  aria-label="Solicitudes">
  <img src="icons/grupos.png" class="menu-icon" alt="Solicitudes">
  <span class="menu-label">Solicitudes</span>
</button>

<!-- Contactos -->
<button
  class="menu-btn"
  (click)="onContactsClick.emit()"
  aria-label="Contactos">
  <img src="icons/contactos.png" class="menu-icon" alt="Contactos">
  <span class="menu-label">Contactos</span>
</button>

<!-- Espaciador (solo en desktop sidebar) -->
<div class="spacer"></div>

<!-- Ajustes (solo desktop) -->
<button
  class="menu-btn desktop-only"
  aria-label="Ajustes">
  <img src="icons/ajustes.png" class="menu-icon" alt="Ajustes">
  <span class="menu-label">Ajustes</span>
</button>

<!-- Perfil / Avatar -->
<button
  class="menu-btn"
  (click)="togglePerfil()"
  aria-label="Perfil"
  [attr.aria-expanded]="perfilAbierto">
  <div class="avatar-circle">
    {{ initial }}
  </div>
  <span class="menu-label">Perfil</span>
</button>
