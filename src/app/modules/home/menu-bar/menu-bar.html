<!-- Este componente solo contiene la barra lateral de iconos -->
<aside class="flex h-full w-16 bg-base-100 border-r border-base-300 flex-col items-center py-4">
  <!-- MENÚ -->
  <ul class="menu menu-vertical flex items-center gap-3">
    <li>
      <button
        class="flex items-center justify-center btn btn-ghost btn-circle tooltip tooltip-right"
        data-tip="Chats"
        aria-label="Chats"
        (click)="onChatsClick.emit()"
      >
        <img src="icons/chats.png" class="w-6 md:w-8" alt="Chats">
      </button>
    </li>

    <li>
      <button
        class="flex items-center justify-center btn btn-ghost btn-circle tooltip tooltip-right"
        data-tip="Solicitudes"
        aria-label="Solicitudes"
        (click)="onRequestsClick.emit()"
      >
        <img src="icons/grupos.png" class="w-6 md:w-8" alt="Solicitudes">
      </button>
    </li>

    <li>
      <button
        class="flex items-center justify-center btn btn-ghost btn-circle tooltip tooltip-right"
        data-tip="Contactos"
        aria-label="Contactos"
      >
        <img src="icons/contactos.png" class="w-6 md:w-8" alt="Contactos">
      </button>
    </li>
  </ul>

  <!-- ESPACIADOR -->
  <div class="flex-1"></div>

  <!-- CONFIGURACIÓN -->
  <button
    class="flex items-center justify-center mb-6 btn btn-ghost btn-circle tooltip tooltip-right"
    data-tip="Ajustes"
    aria-label="Ajustes"
  >
    <img src="icons/ajustes.png" class="w-6 md:w-8" alt="Ajustes">
  </button>

  <!-- PERFIL -->
  <button
    (click)="togglePerfil()"
    class="perfil-button flex flex-col items-center mb-6 focus:outline-none btn btn-ghost btn-circle"
    aria-label="Abrir perfil"
    [attr.aria-expanded]="perfilAbierto ? 'true' : 'false'"
  >
    <div class="avatar online">
      <div class="w-9 md:w-9 rounded-full">
          <div class="bg-neutral text-neutral-content w-full h-full flex items-center justify-center text-2xl font-bold">
                {{ currentUser?.username?.charAt(0)?.toUpperCase() }}
          </div>      </div>
    </div>
  </button>
</aside>
