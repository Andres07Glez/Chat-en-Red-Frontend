<div class="h-full flex flex-col bg-base-100 w-full relative">
  <!-- ── Header ──────────────────────────────────────────────────────── -->

  <div class="flex-none p-4 border-b border-base-200 flex justify-between items-center bg-base-100 z-10">
    <h3 class="font-bold text-lg">Mis Contactos</h3>
    <div class="flex items-center gap-0.5">
      <button class="btn btn-md btn-circle btn-ghost" title="Agregar contacto" (click)="openAddContactModal()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
          class="size-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
      <button class="btn btn-md btn-circle btn-ghost" (click)="closeProfile.emit()">✕</button>
    </div>
  </div>
  <!-- Modal agregar contacto (hijo) -->
  <app-add-contact (modalClosed)="loadContacts()"></app-add-contact>

  <!-- ── Lista ────────────────────────────────────────────────────────── -->
  <div class="flex-1 overflow-y-auto relative">

    <ul class="list bg-base-100 w-full rounded-none min-h-full pb-40">

      <li *ngIf="isLoading" class="flex justify-center p-8">
        <span class="loading loading-spinner loading-md"></span>
      </li>

      <li *ngIf="!isLoading && contacts.length === 0" class="p-4 text-center text-sm opacity-50">
        No tienes contactos aún.
      </li>

      <li *ngFor="let contact of contacts; let last = last" class="list-row hover:bg-base-200 transition-colors">

        <div class="avatar online">
          <div class="w-9 md:w-9 rounded-full">
            <div
              class="bg-neutral text-neutral-content w-full h-full flex items-center justify-center text-2xl font-bold">
              {{ contact?.contactName?.charAt(0)?.toUpperCase() }}
            </div>
          </div>
        </div>

        <div class="flex-grow">
          <div class="font-medium">{{ contact.contactName }}</div>
          <div class="text-xs font-semibold opacity-60">
            {{ contact.contactEmail }}
          </div>
        </div>

        <div class="relative">

          <button class="btn btn-square btn-ghost btn-sm"
            (click)="toggleMenu(contact.id); $event.stopPropagation()">
            <!-- Spinner mientras se inicia conversación con este contacto -->
            <span *ngIf="startingConversationId === contact.contactUserId"
                  class="loading loading-spinner loading-sm">
            </span>
            <!-- Icono normal -->
            <svg *ngIf="startingConversationId !== contact.contactUserId"
              class="size-[1.2em]" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="5" r="1"></circle>
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="12" cy="19" r="1"></circle>
            </svg>
          </button>
          <!-- Panel de opciones -->
          <ul *ngIf="openMenuContactId === contact.id"
            class="absolute right-0 top-full mt-1 z-[999] w-52
                     bg-base-100 border border-base-200 rounded-xl
                     shadow-xl py-1 overflow-hidden">
            <!-- FUNCIONAL: Iniciar conversación -->
            <li>
              <button
                class="w-full flex items-center gap-2 px-4 py-2.5 text-sm
                       hover:bg-base-200 transition-colors text-left"
                (click)="startConversation(contact)">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-primary" fill="none"
                     viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                Iniciar conversación
              </button>
            </li>
            <li>
              <button class="w-full flex items-center gap-2 px-4 py-2.5 text-sm
                             hover:bg-base-200 transition-colors text-left opacity-50">
                👤 Ver perfil
              </button>
            </li>
            <li>
              <button class="w-full flex items-center gap-2 px-4 py-2.5 text-sm text-error
                             hover:bg-error/10 transition-colors text-left"
                             (mousedown)="deleteContact(contact.id); $event.stopPropagation()">
                🗑️ Eliminar
              </button>
            </li>
          </ul>
        </div>
      </li>
    </ul>

  </div>

</div>
