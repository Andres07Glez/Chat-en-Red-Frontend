<button class="btn btn-primary" (click)="openModal()">
  Ver Lista de Contactos
</button>


<!--<dialog id="contact_modal" class="modal">-->
<dialog #contactModal class="modal">
  <div class="modal-box p-0 overflow-visible max-w-lg">

    <!-- Header -->
    <div
      class="sticky top-0 bg-base-100 z-10 p-4 border-b border-base-200 flex justify-between items-center"
    >
      <h3 class="font-bold text-lg">Mis Contactos</h3>
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost">✕</button>
      </form>
    </div>

    <!-- Lista -->
    <ul class="list bg-base-100 w-full rounded-none">

      <!-- Loading -->
      <li *ngIf="isLoading" class="flex justify-center p-8">
        <span class="loading loading-spinner loading-md"></span>
      </li>

      <!-- Sin contactos -->
      <li
        *ngIf="!isLoading && contacts.length === 0"
        class="p-4 text-center text-sm opacity-50"
      >
        No tienes contactos aún.
      </li>

      <!-- Contactos -->
      <li
        *ngFor="let contact of contacts"
        class="list-row hover:bg-base-200 transition-colors"
      >

        <!-- Avatar -->
        <div>
          <img
            class="size-10 rounded-box object-cover"
            [src]="
              contact.contactAvatarUrl ||
              'https://img.daisyui.com/images/profile/demo/2@94.webp'
            "
            alt="Avatar"
          />
        </div>

        <!-- Info -->
        <div class="flex-grow">
          <div class="font-medium">
            {{ contact.contactName }}
          </div>
          <div
            class="text-xs uppercase font-semibold opacity-60"
            [ngClass]="{
              'text-success':
                contact.contactStatusName === 'En línea' ||
                contact.contactStatusName === 'Online'
            }"
          >
            {{ contact.contactStatusName }}
          </div>
        </div>

        <!-- Acciones -->
        <div class="dropdown dropdown-end">
          <button
            class="btn btn-square btn-ghost"
            (click)="toggleMenu(contact.id)"
          >
            <svg
              class="size-[1.2em]"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="5" r="1"></circle>
              <circle cx="12" cy="12" r="1"></circle>
              <circle cx="12" cy="19" r="1"></circle>
            </svg>
          </button>

          <ul
            *ngIf="openMenuContactId === contact.id"
            class="dropdown-content z-[50] menu p-2 shadow bg-base-100 rounded-box w-52 border border-base-200"
          >
            <li><a>💬 Iniciar conversación</a></li>
            <li><a>👤 Ver perfil</a></li>
            <li><a class="text-error">🗑️ Eliminar</a></li>
          </ul>
        </div>

      </li>
    </ul>

    <!-- Espacio inferior -->
    <div class="h-16"></div>
  </div>

  <!-- Backdrop -->
  <form method="dialog" class="modal-backdrop">
    <button></button>
  </form>
</dialog>
