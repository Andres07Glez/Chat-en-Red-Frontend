<dialog #addContactModal class="modal" (close)="onModalClose()">
  <div class="modal-box w-full max-w-md p-0 bg-[#151921] border border-gray-800 text-gray-200 overflow-hidden">
    
    <div class="p-6 pb-2 flex justify-between items-start">
      <div>
        <h3 class="font-bold text-2xl text-white">Agregar Contacto</h3>
        <p class="text-sm text-gray-400 mt-1">Busca usuarios por su username</p>
      </div>
      <button
        (click)="close()"
        class="btn btn-sm btn-circle btn-ghost text-gray-500 hover:text-white hover:bg-white/10">
        ✕
      </button>
    </div>

    <div class="p-6 pt-2">
      <div class="join w-full mb-6 bg-[#1d232a] rounded-lg border border-gray-700 focus-within:border-blue-500 transition-colors">
        <div class="join-item flex items-center pl-3 pr-2 text-gray-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none"
               viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>

        <input
          type="text"
          [(ngModel)]="searchQuery"
          (keyup.enter)="performSearch()"
          class="input join-item w-full bg-transparent border-none focus:outline-none text-white h-12 pl-1"
        />

        <button
          (click)="performSearch()"
          [disabled]="!searchQuery.trim() || isLoading"
          class="btn btn-ghost join-item min-h-0 h-12 text-sm text-gray-400 hover:text-white font-normal px-4 border-l border-gray-700">
          Buscar
        </button>
      </div>

      <div class="min-h-[10rem] flex flex-col justify-center">

        <div *ngIf="!hasSearched && !isLoading"
             class="border-2 border-dashed border-gray-800 rounded-xl flex flex-col items-center justify-center text-gray-600 gap-3 py-8 bg-[#1a1f29]/50">
          <span class="text-xs font-medium">Ingresa un username para comenzar.</span>
        </div>

        <div *ngIf="isLoading"
             class="flex flex-col items-center justify-center gap-3 py-8">
          <span class="loading loading-spinner text-primary"></span>
        </div>

        <div *ngIf="foundUser && !isLoading"
             class="bg-white text-gray-800 rounded-xl p-3 flex gap-3 items-center shadow-lg animate-fade-in-up">
          <div class="avatar">
            <div class="w-12 h-12 rounded bg-gray-200">
              <img [src]="foundUser.avatarUrl || 'https://img.daisyui.com/images/profile/demo/2@94.webp'" />
            </div>
          </div>

          <div class="flex-grow min-w-0">
            <h4 class="font-bold text-sm truncate">{{ foundUser.displayName }}</h4>
            <p class="text-xs text-blue-600 truncate font-mono">{{ foundUser.username }}</p>

            <p *ngIf="relationStatus === 'PENDING'" class="text-xs text-yellow-600">
              Solicitud pendiente
            </p>
            <p *ngIf="relationStatus === 'ACCEPTED'" class="text-xs text-green-600">
              Ya es tu contacto
            </p>
          </div>

          <button
            *ngIf="canAdd"
            (click)="sendRequest()"
            class="btn btn-primary btn-sm px-4 text-white">
            Añadir
          </button>
        </div>

        <div *ngIf="errorMessage && !isLoading"
             class="p-3 bg-red-900/20 border border-red-900/50 rounded-lg mt-2 text-center">
          <p class="text-red-400 text-xs">{{ errorMessage }}</p>
        </div>

      </div>
    </div>

    <div class="bg-[#12151b] p-4 flex justify-end items-center border-t border-gray-800">
      <button
        (click)="close()"
        class="btn btn-ghost btn-sm text-gray-400 hover:text-white font-normal">
        Cancelar
      </button>
    </div>
  </div>

  <form method="dialog" class="modal-backdrop bg-black/60 backdrop-blur-sm">
    <button>close</button>
  </form>
</dialog>
