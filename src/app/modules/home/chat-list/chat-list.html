<div class="flex flex-col h-full bg-base-100 border-r border-base-300">

    <div class="navbar bg-base-200 min-h-[60px] px-4 justify-between sticky top-0 z-10 shadow-sm">
      <div class="flex gap-2">

            <button class="btn btn-ghost btn-circle btn-sm text-base-content" (click)="themeService.toggleTheme()">
                <svg *ngIf="themeService.currentTheme() === 'dark'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg *ngIf="themeService.currentTheme() === 'light'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>

            </div>

        <div class="flex gap-2">
            <button class="btn btn-ghost btn-circle btn-sm text-base-content">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            </button>
            <button class="btn btn-ghost btn-circle btn-sm text-base-content">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" /></svg>
            </button>
        </div>
    </div>

    <div class="p-3 bg-base-100 border-b border-base-200">
        <label class="input input-bordered input-sm flex items-center gap-2 rounded-full bg-base-200 focus-within:bg-base-100 focus-within:border-primary transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-4 h-4 opacity-70"><path fill-rule="evenodd" d="M9.965 11.026a5 5 0 1 1 1.06-1.06l2.755 2.754a.75.75 0 1 1-1.06 1.06l-2.755-2.754ZM10.5 7a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Z" clip-rule="evenodd" /></svg>
            <input type="text" class="grow" placeholder="Buscar chat..." />
        </label>
    </div>

    <div class="flex-1 overflow-y-auto custom-scrollbar">

        <div *ngIf="isLoading" class="flex justify-center items-center h-20 text-primary">
            <span class="loading loading-spinner loading-md"></span>
        </div>

        <div *ngIf="!isLoading && chats.length === 0" class="text-center p-5 text-base-content/50">
            <p>No tienes chats activos.</p>
        </div>

        <div *ngFor="let chat of chats;trackBy: trackByChatId"
             (click)="selectChat(chat)"
             class="flex items-center gap-3 p-3 cursor-pointer hover:bg-base-200 transition-colors border-b border-base-200/50"
             [class.bg-base-200]="selectedChatId === chat.id"
             [class.border-l-4]="selectedChatId === chat.id"
             [class.border-l-primary]="selectedChatId === chat.id"> <div class="avatar placeholder">
                <div class="rounded-full w-12 text-neutral-content shadow-sm flex items-center justify-center"
                     [ngClass]="chat.isGroup ? 'bg-secondary text-secondary-content' : 'bg-neutral'">
                    <span class="text-lg font-bold pb-1">{{ chat.name.charAt(0).toUpperCase() }}</span>
                </div>
            </div>

            <div class="flex-1 min-w-0"> <div class="flex justify-between items-baseline mb-1">
                    <h3 class="font-semibold text-base-content truncate">{{ chat.name }}</h3>
                    <span class="text-xs text-base-content/60 whitespace-nowrap ml-2">
                        {{ formatTime(chat.lastActivity) }}
                    </span>
                </div>

                <div class="flex justify-between items-center">
                    <p class="text-sm text-base-content/70 truncate pr-2">
                        {{ chat.lastMessage || '...' }}
                    </p>

                    <span *ngIf="chat.unreadCount && chat.unreadCount > 0"
                          class="badge badge-primary badge-sm font-bold text-white shadow-lg shadow-primary/40">
                        {{ chat.unreadCount }}
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
