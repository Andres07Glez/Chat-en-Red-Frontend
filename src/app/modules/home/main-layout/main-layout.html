<div class="flex h-screen w-full overflow-hidden bg-base-100">

<aside class="w-[70px] flex-none z-20 shadow-lg">
        <app-menu-bar
            (perfilToggled)="handleProfileToggle($event)"
            (onChatsClick)="openChatList()"
            (onRequestsClick)="openRequests()"
            (onContactsClick)="openContacts()">
        </app-menu-bar>
    </aside>

    <aside
        *ngIf="activeView !== 'requests'"
        class="w-[350px] flex-none border-r border-base-300 flex flex-col transition-all duration-300">

        <app-chat-list
            *ngIf="activeView === 'chats'"
            class="h-full">
        </app-chat-list>

        <app-profile-sidebar
            *ngIf="activeView === 'profile'"
            (closeProfile)="openChatList()"
            class="h-full">
        </app-profile-sidebar>
        <app-contacts-view
         *ngIf="activeView === 'contacts'"
         (closeProfile)="openChatList()">
        </app-contacts-view>

    </aside>

    <main class="flex-1 relative flex flex-col min-w-0 bg-base-100">

        <app-user-requests
            *ngIf="activeView === 'requests'"
            class="h-full w-full block">
        </app-user-requests>

        <ng-container *ngIf="activeView !== 'requests'">

            <ng-container *ngIf="chatState.selectedChat() as chat">
                    <app-chat-window [chatData]="chat" class="h-full block"></app-chat-window>
            </ng-container>

            <div *ngIf="!chatState.selectedChat()" class="flex h-full items-center justify-center text-base-content/50 flex-col gap-4">
                <img src="" class="w-1/3 opacity-50" alt=""> <p class="text-lg font-medium">Selecciona un chat para comenzar</p>
            </div>

        </ng-container>

    </main>

</div>
